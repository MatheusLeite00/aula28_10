name: Release e Deploy em Producao

on:
  push:
    branches: ["master", "main"]

jobs:
  release-e-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Release v1.0.0 - Versão Oficial
          body: |
            Nova versão publicada com sucesso via pipeline CI/CD no GitHub Pages!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .\